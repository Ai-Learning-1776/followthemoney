name: Sync FEC data

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync.yml"
      - "scripts/sync_fec.py"
      - "scripts/name_overrides.json"

permissions:
  contents: write

concurrency:
  group: fec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull FEC data
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/sync_fec.py
      - name: Save the new data
        run: |
          git config user.name "fec-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "Update FEC data"
          git pull --rebase
          git push
